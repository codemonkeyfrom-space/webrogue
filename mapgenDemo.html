<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8-Direction ASCII Roguelike</title>

  <style>
html, body {
  height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: #111;
  color: #fff;
}

input {
  width: 60px;
  text-align: center;
  color: #0F0;
  background-color: black;
}
/* Top half: canvas */
#canvasDiv {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Make canvas fill parent */
#canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: #000; /* optional */
}

.modal {
  display: none; /* Hidden by default */
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.5); /* dim background */
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal-content {
  background: #222;
  color: #fff;
  padding: 20px;
  border: 2px solid #0ff;
  border-radius: 8px;
  text-align: center;
}

.close {
  cursor: pointer;
  float: right;
  font-size: 24px;
  margin-top: -10px;
  margin-right: -10px;
}

#btnSettings {
  font-size: 24px;
  background: none;
  border: none;
  cursor: pointer;
  color: white;
  bottom: 10px;
  right: 10px;
  position: absolute;
}
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🌟</text></svg>">

</head>
<body>
    <div id="canvasDiv">
      <canvas id="canvas" class="panel"></canvas>
      <button id="btnSettings" title="Settings">⚙️</button>
    </div>
    <div id="popup" class="panel modal">
      <div id="popupLeft">
        <table>
          <tr>
            <td>
              <label for="txtCellSize">cell size</label>
            </td>
            <td>
              <input type="text" id="txtCellSize" value="10"></input>
            </td>
          </tr>
          
          <tr>
            <td>
              <label for="txtMapSize">map size</label>
            </td>
            <td>
              <input type="text" id="txtMapSize" value="100"></input>
            </td>
          </tr>
          
          <tr>
            <td>
              <label for="txtBaseFreq">base freq</label>
            </td>
            <td>
              <input type="text" id="txtBaseFreq" value="1"></input>
            </td>
          </tr>
          <tr>
            <td>
              <label for="txtNoiseMultiplier">Noise multiplier</label>
            </td>
            <td>
              <input type="text" id="txtNoiseMultiplier" value="1"></input>
            </td>
          </tr>
        </table>
      </div>




      <div id="popupRight">

          <tr>

  <script type="module" src="./src/mapgenDemo/Demo.ts"></script>
</body>
</html>
